<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accueil - Brest Esport</title>
  <meta name="description" content="Brest Esport — Maillot officiel, actualités du club et boutique. Représente notre équipe avec style." />
  <meta property="og:title" content="Brest Esport — Accueil" />
  <meta property="og:description" content="Découvre le maillot officiel et l’univers Brest Esport." />
  <meta property="og:type" content="website" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Accueil.css" />
</head>
<body>
  <div class="intro-overlay" aria-hidden="true">
    <img src="asset/logo.png" alt="Logo Brest Esport" class="intro-logo" />
  </div>

  <header>
    <div class="navbar">
      <a href="Accueil.html" class="logo" aria-label="Retour à l'accueil">
        <img src="asset/logo.png" alt="Logo Club Esport" />
      </a>
      <button class="menu-toggle" aria-label="Ouvrir le menu" aria-controls="main-nav" aria-expanded="false">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <nav id="main-nav" aria-hidden="true">
        <ul>
          <li><a href="Accueil.html" aria-current="page">Accueil</a></li>
          <li><a href="Boutique.html">Boutique</a></li>
          <li><a href="#">Le Club</a></li>
          <li><a href="Equipe.html">Nos Équipes</a></li>
          <li><a href="Partenaire.html">Partenaires</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <section class="video-banner" aria-label="Bannière vidéo">
    <video autoplay muted loop playsinline preload="metadata" poster="asset/logo.png">
      <source src="asset/VidéoBrest1.mp4" type="video/mp4" />
      Votre navigateur ne supporte pas la vidéo.
    </video>
    <div class="logo-center" aria-hidden="true">
      <img src="asset/logo.png" alt="" />
    </div>
    <div class="scroll-down" role="button" tabindex="0" aria-label="Aller à la section Maillot">↓</div>
  </section>
<section class="sponsors-bar">
  <div class="sponsors-track">
    <img src="asset/BreakdayBar.png" alt="Sponsor 1">
    <img src="asset/BrestBar.png" alt="Sponsor 2">
    <img src="asset/UniBar.png" alt="Sponsor 3">
  </div>
</section>
  <section class="hero" id="maillot" aria-labelledby="maillot-title">
    <div class="container">
      <div class="hero-text">
        <h1 id="maillot-title">Maillot Officiel 2026</h1>
        <p>Représente notre équipe avec style.</p>
        <a href="Boutique.html" class="btn">Découvrir</a>
      </div>
      <div class="hero-image">
        <img src="asset/Maillot.png" alt="Maillot officiel" />
      </div>
    </div>
  </section>
<div class="separator"></div>
  <section class="last-video">
    <h2>📺 Notre dernière vidéo</h2>
    <div class="video-wrapper">
      <iframe 
        src="https://www.youtube.com/embed/_OiPPTsdHIA?rel=0&autoplay=0"
        title="Dernière vidéo YouTube"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-logo">
        <img src="asset/logo.png" alt="Logo Brest Esport" />
      </div>
      <div class="footer-links">
        <a href="Accueil.html" aria-current="page">Accueil</a>
        <a href="Boutique.html">Boutique</a>
        <a href="#">Le Club</a>
        <a href="Equipe.html">Nos Équipes</a>
        <a href="Partenaire.html">Partenaires</a>
      </div>
      <div class="footer-social">
        <a href="" target="_blank" rel="noopener">Twitch</a>
        <a href="" target="_blank" rel="noopener">Twitter</a>
        <a href="" target="_blank" rel="noopener">Youtube</a>
        <a href="" target="_blank" rel="noopener">Instagram</a>
        <a href="" target="_blank" rel="noopener">Discord</a>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2025 Poo__Pee. Tous droits réservés.
    </div>
  </footer>
  
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('nav');
    const overlay = document.querySelector('.intro-overlay');
    const logo = document.querySelector('.intro-logo');
    const hero = document.querySelector('.hero');
    const scrollDown = document.querySelector('.scroll-down');

    if (menuToggle && nav) {
          menuToggle.addEventListener('click', () => {
          const isActive = nav.classList.toggle('active');
          menuToggle.classList.toggle('active');
          menuToggle.setAttribute('aria-expanded', isActive ? 'true' : 'false');
          document.body.classList.toggle('menu-open', isActive);
          nav.setAttribute('aria-hidden', isActive ? 'false' : 'true');
      });
      nav.addEventListener('click', (e) => {
        const target = e.target;
        if (target && target.tagName === 'A' && nav.classList.contains('active')) {
          nav.classList.remove('active');
          menuToggle.classList.remove('active');
          menuToggle.setAttribute('aria-expanded', 'false');
        }
      });
    }

    window.addEventListener('load', () => {
      if (overlay && logo) {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) {
          overlay.classList.add('hide');
        } else {
          setTimeout(() => logo.classList.add('shrink'), 700);
          setTimeout(() => overlay.classList.add('hide'), 1500);
        }
      }
    });

    function scrollToMaillot() {
      const target = document.getElementById('maillot');
      if (!target) return;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' });
    }

    if (scrollDown) {
      scrollDown.addEventListener('click', scrollToMaillot);
      scrollDown.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          scrollToMaillot();
        }
      });
    }

    const revealHero = () => {
      if (!hero) return;
      const rect = hero.getBoundingClientRect();
      if (rect.top < window.innerHeight - 100) {
        hero.classList.add('visible');
        window.removeEventListener('scroll', revealHero);
      }
    };
    window.addEventListener('scroll', revealHero);
    revealHero();



  </script>
</body>
</html>
