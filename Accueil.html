<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accueil - Brest Esport</title>
  <meta name="description" content="Brest Esport — Maillot officiel, actualités du club et boutique. Représente notre équipe avec style." />
  <meta property="og:title" content="Brest Esport — Accueil" />
  <meta property="og:description" content="Découvre le maillot officiel et l’univers Brest Esport." />
  <meta property="og:type" content="website" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Accueil.css" />
</head>
<body>
  <div class="intro-overlay" aria-hidden="true">
    <img src="asset/logo.png" alt="Logo Brest Esport" class="intro-logo" />

  <header>
    <div class="navbar">
      <a href="Accueil.html" class="logo" aria-label="Retour à l'accueil">
        <img src="asset/logo.png" alt="Logo Club Esport" />
      </a>
      <button class="menu-toggle" aria-label="Ouvrir le menu" aria-controls="main-nav" aria-expanded="false">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <nav id="main-nav" aria-hidden="true">
        <ul>
          <li><a href="Accueil.html" aria-current="page">Accueil</a></li>
          <li><a href="Boutique.html">Boutique</a></li>
          <li><a href="#">Le Club</a></li>
          <li><a href="Equipe.html">Nos Équipes</a></li>
          <li><a href="Partenaire.html">Partenaires</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <section class="video-banner" aria-label="Bannière vidéo">
    <video autoplay muted loop playsinline preload="metadata" poster="asset/logo.png">
      <source src="asset/VidéoBrest1.mp4" type="video/mp4" />
      Votre navigateur ne supporte pas la vidéo.
    </video>
    <div class="logo-center" aria-hidden="true">
      <img src="asset/logo.png" alt="" />
    </div>
    <div class="scroll-down" role="button" tabindex="0" aria-label="Aller à la section Maillot">↓</div>
  </section>
<section class="sponsors-bar">
  <div class="sponsors-track">
    <img src="asset/BreakdayBar.png" alt="Sponsor 1">
    <img src="asset/BrestBar.png" alt="Sponsor 2">
    <img src="asset/UniBar.png" alt="Sponsor 3">
  </div>
</section>
<section class="kc-grid">
    <a class="kc-item item-big-left-top" href="Equipe.html">
        <img src="asset/NosEquipe.png" alt="">
        <span>NOS EQUIPE</span>
    </a>

    <a class="kc-item item-small-right-top" href="Boutique.html" id="maillot">
        <img src="asset/MaillotAccueil.png" alt="">
        <span>Maillot 2026</span>
    </a>

    <a class="kc-item item-big-left-bottom" href="#">
        <img src="images/tournois.jpg" alt="">
        <span>TOURNOIS</span>
    </a>

    <a class="kc-item item-big-right-bottom" href="#">
        <img src="asset/test.png" alt="">
        <span>Palmares</span>
    </a>
</section>

<section class="last-video">
    <h2>📺 Notre dernière vidéo</h2>
    <div class="video-wrapper">
      <iframe 
        src="https://www.youtube.com/embed/_OiPPTsdHIA?rel=0&autoplay=0"
        title="Dernière vidéo YouTube"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-logo">
        <img src="asset/logo.png" alt="Logo Brest Esport" />
      </div>
      
      <div class="footer-links accordion-item">
        <button class="accordion-header" aria-expanded="false" aria-controls="info-content">
          INFORMATIONS 
          <span class="icon" aria-hidden="true">+</span>
        </button>
        <div class="accordion-content" id="info-content">
          <a href="Accueil.html" aria-current="page">Accueil</a>
          <a href="Boutique.html">Boutique</a>
          <a href="#">Le Club</a>
          <a href="Equipe.html">Nos Équipes</a>
          <a href="Partenaire.html">Partenaires</a>
        </div>
      </div>

      <div class="footer-social accordion-item">
        <button class="accordion-header" aria-expanded="false" aria-controls="social-content">
          NOS RESEAUX 
          <span class="icon" aria-hidden="true">+</span>
        </button>
        <div class="accordion-content" id="social-content">
          <a href="" target="_blank" rel="noopener">Twitch</a>
          <a href="" target="_blank" rel="noopener">Twitter</a>
          <a href="" target="_blank" rel="noopener">Youtube</a>
          <a href="" target="_blank" rel="noopener">Instagram</a>
          <a href="" target="_blank" rel="noopener">Discord</a>
        </div>
      </div>

    </div>
    <div class="footer-bottom">
      &copy; 2025 Poo__Pee. Tous droits réservés.
    </div>
  </footer>
  
  <script>
    // --- Fonctionnalité de la navigation mobile ---
    const menuToggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('nav');
    const overlay = document.querySelector('.intro-overlay');
    const logo = document.querySelector('.intro-logo');
    const scrollDown = document.querySelector('.scroll-down');

    if (menuToggle && nav) {
        menuToggle.addEventListener('click', () => {
            const isActive = nav.classList.toggle('active');
            menuToggle.classList.toggle('active');
            menuToggle.setAttribute('aria-expanded', isActive ? 'true' : 'false');
            document.body.classList.toggle('menu-open', isActive);
            nav.setAttribute('aria-hidden', isActive ? 'false' : 'true');
        });
        nav.addEventListener('click', (e) => {
            const target = e.target;
            if (target && target.tagName === 'A' && nav.classList.contains('active')) {
                nav.classList.remove('active');
                menuToggle.classList.remove('active');
                menuToggle.setAttribute('aria-expanded', 'false');
            }
        });
    }

    // --- Animation Intro ---
    window.addEventListener('load', () => {
        if (overlay && logo) {
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) {
                overlay.classList.add('hide');
            } else {
                setTimeout(() => logo.classList.add('shrink'), 700);
                setTimeout(() => overlay.classList.add('hide'), 1500);
            }
        }
    });

    // --- Scroll vers Maillot ---
    function scrollToMaillot() {
        const target = document.getElementById('maillot');
        if (!target) return;
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' });
    }

    if (scrollDown) {
        scrollDown.addEventListener('click', scrollToMaillot);
        scrollDown.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                scrollToMaillot();
            }
        });
    }
    
    // --- Fonctionnalité Accordéon Footer ---
    function setupFooterAccordion() {
        // Cible uniquement les en-têtes si l'écran est petit (moins de 640px)
        if (window.matchMedia('(max-width: 639px)').matches) {
            const headers = document.querySelectorAll('.accordion-header');

            headers.forEach(header => {
                if (header.classList.contains('listener-added')) return;
                
                header.addEventListener('click', () => {
                    const content = document.getElementById(header.getAttribute('aria-controls'));
                    const isExpanded = header.getAttribute('aria-expanded') === 'true';

                    // Fermer tous les autres 
                    document.querySelectorAll('.accordion-header').forEach(h => {
                        if (h !== header && h.getAttribute('aria-expanded') === 'true') {
                           h.setAttribute('aria-expanded', 'false');
                           const otherContent = document.getElementById(h.getAttribute('aria-controls'));
                           otherContent.style.maxHeight = '0';
                           otherContent.style.paddingTop = '0';
                        }
                    });

                    // Ouvrir/Fermer l'élément actuel
                    if (isExpanded) {
                        header.setAttribute('aria-expanded', 'false');
                        content.style.maxHeight = '0';
                        content.style.paddingTop = '0';
                    } else {
                        header.setAttribute('aria-expanded', 'true');
                        // CORRECTION : Ajouter 20px de buffer au scrollHeight pour ne pas couper le dernier lien
                        content.style.maxHeight = content.scrollHeight + 20 + "px";
                        content.style.paddingTop = '14px'; 
                    }
                });
                
                header.classList.add('listener-added');
            });
        }
    }

    // Lance l'accordéon au chargement
    window.addEventListener('load', setupFooterAccordion);

    // Gère le cas où l'utilisateur redimensionne entre mobile/desktop
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(setupFooterAccordion, 250); 
    });
  </script>
</body>
</html>
